<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Define a gorgeous primary gradient (orange to deep coral/red) matching GlobeTrotter brand -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff3b00" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8f9fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff3b00" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer circle with subtle gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="url(#brand-grad)" stroke-width="12" />
  
  <!-- Stylized Globe / Compass Design -->
  <g filter="url(#shadow)">
    <!-- Globe Grid Lines -->
    <!-- Equator -->
    <line x1="80" y1="256" x2="432" y2="256" stroke="url(#brand-grad)" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    <!-- Prime Meridian -->
    <line x1="256" y1="80" x2="256" y2="432" stroke="url(#brand-grad)" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    <!-- Latitudes/Longitudes -->
    <path d="M120 180 Q256 220 392 180" fill="none" stroke="url(#brand-grad)" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    <path d="M120 332 Q256 292 392 332" fill="none" stroke="url(#brand-grad)" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    <path d="M180 120 Q220 256 180 392" fill="none" stroke="url(#brand-grad)" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    <path d="M332 120 Q292 256 332 392" fill="none" stroke="url(#brand-grad)" stroke-width="8" stroke-linecap="round" opacity="0.3" />

    <!-- Compass Circle Outline -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#brand-grad)" stroke-width="16" />
    
    <!-- Compass Pointer (Needle) -->
    <!-- North Pointer (Solid orange-red gradient) -->
    <path d="M256 120 L290 256 L256 235 Z" fill="url(#brand-grad)" />
    <!-- North Pointer Shadow/Highlight -->
    <path d="M256 120 L222 256 L256 235 Z" fill="#ff9f40" />
    
    <!-- South Pointer -->
    <path d="M256 392 L222 256 L256 277 Z" fill="#e4e6eb" />
    <path d="M256 392 L290 256 L256 277 Z" fill="#ccd0d5" />
    
    <!-- Compass Center Pin -->
    <circle cx="256" cy="256" r="16" fill="#ffffff" stroke="url(#brand-grad)" stroke-width="6" />
  </g>
</svg>